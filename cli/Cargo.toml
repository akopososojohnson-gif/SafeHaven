[package]
name = "safehaven-cli"
version = "0.1.0"
edition = "2021"
authors = ["SafeHaven Team"]
license = "AGPL-3.0"
description = "SafeHaven CLI — zero-knowledge secrets vault command-line tool"

[[bin]]
name = "safehaven"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "3.2", features = ["sync-secret-service"] }
directories = "5.0"
anyhow = "1.0"
thiserror = "1.0"
rpassword = "7.3"
base64 = "0.22"
url = "2.5"
uuid = { version = "1.10", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

crypto = { package = "safehaven-crypto", path = "../crypto" }

[profile.release]
opt-level = 3
lto = true
strip = true
