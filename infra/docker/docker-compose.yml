version: "3.9"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: safehaven-postgres
    environment:
      POSTGRES_USER: safehaven
      POSTGRES_PASSWORD: safehaven
      POSTGRES_DB: safehaven
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safehaven -d safehaven"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: safehaven-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
